<?xml version="1.0" encoding="UTF-8"?>
<!-- wasmcart: custom system for Batocera. Core is symlinked into /usr/lib/libretro by
     the 'wasmcart' user service (/userdata/system/services/wasmcart). -->
<systemList>
  <system>
    <name>wasmcart</name>
    <fullname>wasmcart</fullname>
    <manufacturer>wasmcart</manufacturer>
    <release>2026</release>
    <hardware>console</hardware>
    <path>/userdata/roms/wasmcart</path>
    <extension>.wasc .WASC .wasm</extension>
    <command>emulatorlauncher %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
    <platform>wasmcart</platform>
    <theme>wasmcart</theme>
    <emulators>
      <emulator name="libretro">
        <cores>
          <core default="true">wasmcart</core>
        </cores>
      </emulator>
    </emulators>
  </system>
</systemList>
